# 1. Configuration et Secrets
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: payment_db
  POSTGRES_USER: payment_user
  POSTGRES_PASSWORD: payment_pass
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  SPRING_PROFILES_ACTIVE: "local"
  DB_URL: "jdbc:postgresql://postgres:5432/payment_db"
---
# 2. Base de données PostgreSQL (Deployment + Service interne)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payment_user", "-d", "payment_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# 3. Application Spring Boot (Deployment + Service exposé)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-app
  template:
    metadata:
      labels:
        app: payment-app
    spec:
      # Équivalent du depends_on: service_healthy
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done;']
      containers:
        - name: app
          image: payment-gateway-lab:local
          imagePullPolicy: Never # Obligatoire pour utiliser l'image locale sans registry externe
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          # Exploitée par JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" dans ton Dockerfile
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Remplace le HEALTHCHECK du Dockerfile (désactivé par Kubernetes)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payment-app
spec:
  type: ClusterIP
  selector:
    app: payment-app
  ports:
    - port: 8080
      targetPort: 8080