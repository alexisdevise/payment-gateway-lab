spring:
  application:
    name: payment-gateway-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs   # JSON logs (Elastic Common Schema), ready for Loki/ELK

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for K8s probes
  metrics:
    tags:
      application: ${spring.application.name}

# Secrets have NO default here: the app fails fast if they are not injected (K8s Secret / env vars).
# For local runs use the "local" profile (application-local.yml, dev-only values).
payment:
  crypto:
    keys: {}
  consumers: []
