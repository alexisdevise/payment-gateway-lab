# DEV ONLY. Never used outside a laptop / kind.
# Secrets come from environment variables (docker compose / K8s Secret), or from .env for IDE runs (import below).
spring:
  config:
    import: optional:file:.env[.properties]   # .env is KEY=VALUE, read as a properties file; absent in containers
  datasource:
    # Containers set DB_USER / DB_PASSWORD; IDE runs fall back to the POSTGRES_* entries of .env. No hard-coded value.
    username: ${DB_USER:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  structured:
    format:
      console: ""   # human-readable logs locally

payment:
  crypto:
    keys:
      # keyId -> base64(256-bit key), shared with the consumer apps that encrypt payloads
      dev-2026-11: ${PAYMENT_CRYPTO_KEY_DEV}   # no default: the app fails at startup if it is not provided
  # Who the consumers are (id, channel, merchant) is plain config; their API key hashes are secrets from the env.
  consumers:
    - id: checkout-web
      channel: ECOMMERCE
      merchant-id: merchant-demo
      api-key-sha256: ${API_KEY_SHA256_CHECKOUT_WEB}
    - id: merchant-backoffice
      channel: MERCHANT_BO
      merchant-id: merchant-demo
      api-key-sha256: ${API_KEY_SHA256_MERCHANT_BACKOFFICE}
    - id: other-merchant-backoffice
      channel: MERCHANT_BO
      merchant-id: merchant-other
      api-key-sha256: ${API_KEY_SHA256_OTHER_MERCHANT_BACKOFFICE}
