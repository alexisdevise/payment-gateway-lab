services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: payment-gateway-lab:local
    container_name: payment-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local   # DEV ONLY: public demo keys, see application-local.yml
      DB_URL: jdbc:postgresql://postgres:5432/payment_db   # Docker network, not the host port
    ports:
      - "8080:8080"
